server {
    listen 80;
    server_name admin.wordrise.uz;
    
    # Optional: redirect to HTTPS
    # return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.wordrise.uz;
    
    # SSL config goes here (Let's encrypt or custom certificates)
    # ssl_certificate /etc/letsencrypt/live/admin.wordrise.uz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/admin.wordrise.uz/privkey.pem;
    
    # Admin Panel Built Files Path
    root /var/www/wordrise/admin_panel/dist;
    index index.html;

    # Single Page Application Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}
